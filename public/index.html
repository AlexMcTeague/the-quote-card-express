<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/style.css">
        <title>Quote Card Express</title>
        <script src="./js/index.js" defer></script>
    </head>

    <body>
        <main class="main">
            <div class="background-img"></div>
            <article class="quote-container">
                <q id="quote" class="quote-text">Limitations foster creativity. Tell an artist to paint anything, and he may struggle, but tell him to create something specific, in a set amount of time, for a certain audience, and these constraints might well push him to produce something he might never have come up with on his own.</q>
                <p id="author" class="author-text">J.C. McCrae</p>
            </article>
        </main>
        
    </body>
</html>
